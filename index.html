<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6f5f2" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#131b2e" media="(prefers-color-scheme: dark)" />
    <title>Gastos Controlados</title>
    <meta name="description" content="Conecta tu Gmail y entiende tus gastos del mes: cuánto te queda, cuánto puedes gastar por día y si vas en ritmo." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/svg+xml" href="/favicon-dark.svg" media="(prefers-color-scheme: dark)" />
    <link id="apple-touch-icon" rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <script>
      (function () {
        var STORAGE_KEY = "gastos-theme";
        var mq = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)");
        var link = document.getElementById("apple-touch-icon");
        function readPreference() {
          try {
            var stored = window.localStorage && window.localStorage.getItem(STORAGE_KEY);
            return stored === "light" || stored === "dark" ? stored : "system";
          } catch (e) {
            return "system";
          }
        }
        function sync() {
          var pref = readPreference();
          var isDark = pref === "dark" || (pref === "system" && Boolean(mq && mq.matches));
          var theme = isDark ? "dark" : "light";
          document.documentElement.dataset.theme = theme;
          document.documentElement.dataset.themePreference = pref;
          document.documentElement.style.colorScheme = theme;
          if (link) {
            link.href = isDark ? "/apple-touch-icon-dark.png" : "/apple-touch-icon.png";
          }
          var metas = document.querySelectorAll('meta[name="theme-color"]');
          var color = isDark ? "#131b2e" : "#f6f5f2";
          for (var i = 0; i < metas.length; i++) {
            metas[i].setAttribute("content", color);
          }
        }
        sync();
        if (mq && mq.addEventListener) mq.addEventListener("change", sync);
      })();
    </script>
    <meta name="apple-mobile-web-app-title" content="Gastos" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Gastos Controlados" />
    <meta property="og:description" content="Conecta tu Gmail y entiende tus gastos del mes: cuánto te queda, cuánto puedes gastar por día y si vas en ritmo." />
    <meta property="og:locale" content="es_CL" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Gastos Controlados" />
    <meta name="twitter:description" content="Conecta tu Gmail y entiende tus gastos del mes: cuánto te queda, cuánto puedes gastar por día y si vas en ritmo." />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/client/main.tsx"></script>
  </body>
</html>
